name: Deploy Supabase Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "supabase/functions/approve-user/**"
      - "supabase/functions/send-notification/**"
      - "supabase/functions/send-quote-email/**"
      - ".github/workflows/deploy_supabase.yml"

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    strategy:
      fail-fast: false
      matrix:
        function_name:
          - approve-user
          - send-notification
          - send-quote-email
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Supabase secrets
        shell: bash
        run: |
          missing=()
          [[ -z "$SUPABASE_ACCESS_TOKEN" ]] && missing+=("SUPABASE_ACCESS_TOKEN")
          [[ -z "$SUPABASE_PROJECT_REF" ]] && missing+=("SUPABASE_PROJECT_REF")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub secrets:\n- %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set quote mail secrets
        if: matrix.function_name == 'send-quote-email'
        env:
          QUOTE_MAIL_HOST: ${{ secrets.QUOTE_MAIL_HOST }}
          QUOTE_MAIL_SMTP_PORT: ${{ secrets.QUOTE_MAIL_SMTP_PORT }}
          QUOTE_MAIL_USER: ${{ secrets.QUOTE_MAIL_USER }}
          QUOTE_MAIL_PASSWORD: ${{ secrets.QUOTE_MAIL_PASSWORD }}
        run: |
          if [[ -z "$QUOTE_MAIL_HOST" || -z "$QUOTE_MAIL_USER" || -z "$QUOTE_MAIL_PASSWORD" ]]; then
            echo "QUOTE_MAIL_* GitHub secrets not set - skipping (function will fail to send until they are added)."
            exit 0
          fi
          supabase secrets set \
            QUOTE_MAIL_HOST="$QUOTE_MAIL_HOST" \
            QUOTE_MAIL_SMTP_PORT="${QUOTE_MAIL_SMTP_PORT:-465}" \
            QUOTE_MAIL_USER="$QUOTE_MAIL_USER" \
            QUOTE_MAIL_PASSWORD="$QUOTE_MAIL_PASSWORD" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy ${{ matrix.function_name }}
        run: supabase functions deploy "${{ matrix.function_name }}" --project-ref "$SUPABASE_PROJECT_REF" --use-api
