name: Migrate Quote Data to Shared Supabase

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/migrate-quote-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quote-data-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SOURCE_SUPABASE_URL: ${{ secrets.TEKLIF_SUPABASE_URL }}
      TARGET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      MIGRATION_CONFIRM: MOVE_QUOTE_DATA_TO_SHARED_DB

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -z "$SUPABASE_ACCESS_TOKEN" ]] && missing+=("SUPABASE_ACCESS_TOKEN")
          [[ -z "$SOURCE_SUPABASE_URL" ]] && missing+=("TEKLIF_SUPABASE_URL")
          [[ -z "$TARGET_SUPABASE_URL" ]] && missing+=("SUPABASE_URL")
          if (( ${#missing[@]} > 0 )); then
            printf 'Eksik GitHub secret:\n- %s\n' "${missing[@]}"
            exit 1
          fi
          if [[ "$SOURCE_SUPABASE_URL" == "$TARGET_SUPABASE_URL" ]]; then
            echo "Kaynak ve hedef Supabase adresleri aynı olamaz."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Resolve existing project keys without logging them
        shell: bash
        run: |
          set -euo pipefail
          source_ref="$(python -c 'import os; from urllib.parse import urlparse; print(urlparse(os.environ["SOURCE_SUPABASE_URL"]).hostname.split(".")[0])')"
          target_ref="$(python -c 'import os; from urllib.parse import urlparse; print(urlparse(os.environ["TARGET_SUPABASE_URL"]).hostname.split(".")[0])')"

          resolve_key() {
            local project_ref="$1"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Accept: application/json" \
              "https://api.supabase.com/v1/projects/$project_ref/api-keys?reveal=true" |
              jq -r '
                (
                  map(select(.name == "service_role")) +
                  map(select((.api_key // "") | startswith("sb_secret_")))
                )[0].api_key // empty
              '
          }

          source_key="$(resolve_key "$source_ref")"
          target_key="$(resolve_key "$target_ref")"
          if [[ -z "$source_key" || -z "$target_key" ]]; then
            echo "Kaynak veya hedef yönetim anahtarı alınamadı."
            exit 1
          fi

          echo "::add-mask::$source_key"
          echo "::add-mask::$target_key"
          echo "SOURCE_SERVICE_ROLE_KEY=$source_key" >> "$GITHUB_ENV"
          echo "TARGET_SERVICE_ROLE_KEY=$target_key" >> "$GITHUB_ENV"
          echo "TARGET_PROJECT_REF=$target_ref" >> "$GITHUB_ENV"

      - name: Final read-only safety check
        shell: bash
        run: |
          set -euo pipefail
          dart tool/quote_data_inventory.dart --require-empty-target |
            tee quote-migration-preflight.txt

      - name: Create target quote schema
        shell: bash
        run: |
          set -euo pipefail
          {
            execute_sql() {
              local sql_file="$1"
              echo "Applying $sql_file"
              jq -n --rawfile query "$sql_file" \
                '{query: $query, read_only: false}' |
                curl --fail-with-body --silent --show-error \
                  -X POST \
                  -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data-binary @- \
                  "https://api.supabase.com/v1/projects/$TARGET_PROJECT_REF/database/query"
              echo
            }

            execute_sql "uzalteklif/supabase/schema.sql"
            execute_sql \
              "uzalteklif/supabase/migrations/20260728_discovery_device_templates.sql"
            execute_sql \
              "supabase/migrations/20260731_quote_unified_access.sql"
          } 2>&1 | tee quote-schema-result.txt

      - name: Wait for REST schema cache
        shell: bash
        run: sleep 12

      - name: Post-schema dry-run
        shell: bash
        run: |
          set -euo pipefail
          dart tool/migrate_quote_data.dart 2>&1 |
            tee quote-post-schema-dry-run.txt

      - name: Copy and verify quote data
        shell: bash
        run: |
          set -euo pipefail
          dart tool/migrate_quote_data.dart --apply |
            tee quote-data-migration-result.txt

      - name: Save sanitized migration report
        if: always()
        env:
          MIGRATION_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/generated
          {
            echo '# Teklif Veri Taşıma Sonucu'
            echo
            echo 'Kontrol zamanı: `'"$(date -u +'%Y-%m-%d %H:%M UTC')"'`'
            echo
            echo "İş akışı durumu: \`$MIGRATION_JOB_STATUS\`"
            echo
            echo '```text'
            for report in \
              quote-migration-preflight.txt \
              quote-schema-result.txt \
              quote-post-schema-dry-run.txt \
              quote-data-migration-result.txt; do
              if [[ -f "$report" ]]; then
                echo "=== $report ==="
                cat "$report"
                echo
              fi
            done
            echo '```'
          } > docs/generated/quote-data-migration-result.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/quote-data-migration-result.md
          git commit -m "Record quote data migration result [skip ci]"
          git pull --rebase origin main
          git push
