name: Apply Two-User Migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Çalıştırmak için IKI_KULLANICIYI_TASI yazın"
        required: true
        type: string
      invite_redirect_url:
        description: "Davet bağlantısının açacağı Teklif adresi"
        required: true
        default: "https://uzalteknikservis.info/teklif/"
        type: string

permissions:
  contents: read

concurrency:
  group: unified-user-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SOURCE_SUPABASE_URL: ${{ secrets.TEKLIF_SUPABASE_URL }}
      TARGET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      TARGET_INVITE_REDIRECT_URL: ${{ inputs.invite_redirect_url }}
      USER_MIGRATION_CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_SOURCE_USER_COUNT: "2"
      MIGRATION_CONFIRM: USERS_ONLY

    steps:
      - name: Validate explicit confirmation and configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$USER_MIGRATION_CONFIRMATION" != "IKI_KULLANICIYI_TASI" ]]; then
            echo "Onay metni hatalı; hiçbir veri yazılmadı."
            exit 1
          fi

          missing=()
          [[ -z "$SUPABASE_ACCESS_TOKEN" ]] && missing+=("SUPABASE_ACCESS_TOKEN")
          [[ -z "$SOURCE_SUPABASE_URL" ]] && missing+=("TEKLIF_SUPABASE_URL")
          [[ -z "$TARGET_SUPABASE_URL" ]] && missing+=("SUPABASE_URL")
          if (( ${#missing[@]} > 0 )); then
            printf 'Eksik GitHub secret:\n- %s\n' "${missing[@]}"
            exit 1
          fi

          if [[ "$SOURCE_SUPABASE_URL" == "$TARGET_SUPABASE_URL" ]]; then
            echo "Kaynak ve hedef Supabase adresleri aynı olamaz."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Resolve existing project admin keys without logging them
        shell: bash
        run: |
          set -euo pipefail
          source_ref="$(python -c 'import os; from urllib.parse import urlparse; print(urlparse(os.environ["SOURCE_SUPABASE_URL"]).hostname.split(".")[0])')"
          target_ref="$(python -c 'import os; from urllib.parse import urlparse; print(urlparse(os.environ["TARGET_SUPABASE_URL"]).hostname.split(".")[0])')"

          resolve_key() {
            local project_ref="$1"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Accept: application/json" \
              "https://api.supabase.com/v1/projects/$project_ref/api-keys?reveal=true" |
              jq -r '
                (
                  map(select(.name == "service_role")) +
                  map(select((.api_key // "") | startswith("sb_secret_")))
                )[0].api_key // empty
              '
          }

          source_key="$(resolve_key "$source_ref")"
          target_key="$(resolve_key "$target_ref")"
          if [[ -z "$source_key" || -z "$target_key" ]]; then
            echo "Kaynak veya hedef yönetim anahtarı alınamadı."
            exit 1
          fi

          echo "::add-mask::$source_key"
          echo "::add-mask::$target_key"
          echo "SOURCE_SERVICE_ROLE_KEY=$source_key" >> "$GITHUB_ENV"
          echo "TARGET_SERVICE_ROLE_KEY=$target_key" >> "$GITHUB_ENV"

      - name: Final dry-run
        shell: bash
        run: dart tool/migrate_supabase_users.dart

      - name: Invite and migrate exactly two users
        shell: bash
        run: dart tool/migrate_supabase_users.dart --apply
